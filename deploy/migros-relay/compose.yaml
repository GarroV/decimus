# Ретранслятор Migros на MUSPELHEIM (D434). Порт — только петля хоста; в сеть
# Tailscale его выводит `tailscale serve --bg --tcp 9021 tcp://127.0.0.1:9021`.
# Сборка из корня репозитория: docker compose -f deploy/migros-relay/compose.yaml up -d --build
name: decimus-migros-relay
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/migros-relay/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9021:9021"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

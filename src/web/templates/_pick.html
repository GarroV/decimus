{#
  Отбор — выпадающий список (`<select>`), общий для всех экранов, где сужают
  выборку (D611: никаких рядов чипов и тегов, только списки, столбцы и меню).

  Варианты — готовые адреса, собранные в обработчике: шаблон не считает и не
  склеивает ссылки. Значение пункта — адрес перехода; `static/pick.js`
  переходит по нему сразу при выборе. БЕЗ СКРИПТА выбор сам ничего не делает,
  поэтому под `<noscript>` те же варианты лежат обычными ссылками.

  Подпись — название размерности над списком; в самом списке всегда виден
  ТЕКУЩИЙ выбор, так что панель отвечает «что сужено» одним взглядом.
  Несколько отборов на экране идут одной строкой списков над тем, что они
  сужают (interface-logic п. 7).
#}
{% macro pick(chip) %}
  <label class="pickbox">
    {% if chip.label %}<span class="pickbox__label">{{ chip.label }}</span>{% endif %}
    <select class="pickselect pickbox__select{% if chip.current %} is-on{% endif %}" data-pick-nav
            aria-label="{{ chip.label or chip.current_title }}">
      {% for option in chip.options %}
        <option value="{{ option.href }}"{% if option.selected %} selected{% endif %}>{{ option.title }}{% if option.count is not none %} · {{ option.count }}{% endif %}</option>
      {% endfor %}
    </select>
  </label>
  <noscript>
    <span class="pickbox__nojs">
      {% for option in chip.options %}<a href="{{ option.href }}"{% if option.selected %} aria-current="true"{% endif %}>{{ option.title }}</a>{% endfor %}
    </span>
  </noscript>
{% endmacro %}

{#
  Выбор языка на экранах входа (D492, D743): маленький выпадающий список с кодами
  языков в правом верхнем углу, любое число языков. Выбор отправляет форму сам
  (`pick.js`), без скрипта — кнопка из <noscript>. Форма GET: прочие параметры
  адреса (`next`, `login_hint`) едут скрытыми полями, чтобы смена языка не сбрасывала их.
#}
<form class="langsel login__lang" method="get" action="{{ url(current_path) }}">
  {% for key, value in request.args.items(multi=True) if key != 'lang' %}
    <input type="hidden" name="{{ key }}" value="{{ value }}">
  {% endfor %}
  <select class="pickselect langsel__select" name="lang" data-lang-submit aria-label="{{ t('nav.lang') }}">
    {% for code in langs %}
      <option value="{{ code }}" lang="{{ code }}" title="{{ t('nav.lang.' ~ code) }}"{% if code == lang %} selected{% endif %}>{{ code|upper }}</option>
    {% endfor %}
  </select>
  <noscript><button class="langsel__go" type="submit">{{ t('nav.lang.apply') }}</button></noscript>
</form>

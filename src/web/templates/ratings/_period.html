{#
  Списки периода «Рейтингов» (D630): «Период РС» и «Неделя РКО» — над календарём «с — по»
  в одном окне. Выпадающие списки, не ряды кнопок (D611): значение пункта — готовый
  адрес, переход делает `pick.js`; БЕЗ СКРИПТА под `<noscript>` те же пункты лежат
  ссылками. Выбран пункт, совпавший с текущим отрезком; не совпал ни один — в списке
  заглушка. Ключи и «выбран» считает `ratings_calendar`, шаблон не считает.
  `href(group, value, key)` — макрос адреса из `index.html`, передаётся аргументом:
  свой копии адреса здесь нет.
#}
{% macro period_lists(calendar, href, group, value) %}
  {% for kind, options in (('rs', calendar.rs_options), ('rko', calendar.rko_options)) if options %}
    {% set label = t('ratings.period.' ~ kind) %}
    <label class="rt-cal__list">
      <span class="rt-field__label">{{ label }}</span>
      <select class="pickselect" data-pick-nav data-period-list="{{ kind }}" aria-label="{{ label }}">
        {% if not options|selectattr('on')|list %}<option value="" selected disabled>{{ t('ratings.period.none') }}</option>{% endif %}
        {% for o in options %}<option value="{{ href(group, value, o.key) }}"{% if o.on %} selected{% endif %}>{{ o.title }}</option>{% endfor %}
      </select>
    </label>
    <noscript>
      <span class="rt-cal__nojs">{% for o in options %}<a href="{{ href(group, value, o.key) }}"{% if o.on %} aria-current="true"{% endif %}>{{ o.title }}</a> {% endfor %}</span>
    </noscript>
  {% endfor %}
{% endmacro %}

{#
  Периоды рейтинга внутри месяца или квартала (контролинг 05.11.2026): строка под отбором —
  «‹ · целиком · периоды датами · ›». Средние месяца или квартала — на «целиком»; пункт
  открывает один период рейтинга, месяц или квартал едет в адресе (`within`), чтобы
  строка осталась. Пункты, выбранный и соседи считает `ratings_calendar._inside`.
#}
{% macro period_steps(inside, href, group, value, kind) %}
  {% if inside %}
  <nav class="rt-steps" aria-label="{{ t('ratings.inside.' ~ kind) }}">
    <span class="rt-field__label">{{ t('ratings.inside.' ~ kind) }}</span>
    {% if inside.prev %}<a class="rt-cal__arrow" href="{{ href(group, value, inside.prev, inside.parent_key) }}" aria-label="{{ t('ratings.inside.prev') }}">‹</a>
    {% else %}<span class="rt-cal__arrow" aria-disabled="true">‹</span>{% endif %}
    <a class="rt-step{% if inside.whole_on %} is-on{% endif %}" href="{{ href(group, value, inside.parent_key) }}"{% if inside.whole_on %} aria-current="true"{% endif %}>{{ t('ratings.inside.whole', title=inside.parent_title) }}</a>
    {% for o in inside.items %}<a class="rt-step{% if o.on %} is-on{% endif %}" href="{{ href(group, value, o.key, inside.parent_key) }}"{% if o.on %} aria-current="true"{% endif %}>{{ o.title }}</a>
    {% endfor %}
    {% if inside.next %}<a class="rt-cal__arrow" href="{{ href(group, value, inside.next, inside.parent_key) }}" aria-label="{{ t('ratings.inside.next') }}">›</a>
    {% else %}<span class="rt-cal__arrow" aria-disabled="true">›</span>{% endif %}
  </nav>
  {% endif %}
{% endmacro %}

# Проверки каждого PR в main (решение владельца 12.10.2026: в репозиторий
# приходит второй разработчик, а `main` раскатывается на прод).
#
# Гоняет то, что не требует базы: формат, линт, типы и тесты без базы (в том числе
# браузерные: Chromium ставится здесь же). Тесты,
# которым нужна база, здесь пропускаются — они идут на тестовой базе
# MUSPELHEIM (`make test`), и зелёный прогон здесь НЕ означает, что они
# прошли. Поэтому шаг тестов печатает число пропущенных в итог прогона.
#
# Решение владельца 12.10.2026: проверки больше не блокируют слияние (продукт ещё
# не в работе, «влить все и там уже тестировать»). PR-прогон справочный; ворота —
# прогон на `main` после слияния: покраснел — владельцу уходит сообщение в Telegram,
# позеленел — второе. Красный main чинится раньше новых слияний.
#
# Расход: репозиторий публичный, минуты Actions бесплатны.
name: Проверки PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  ALERT_FAIL: "DECIMUS: main красный — починить раньше новых слияний."
  ALERT_OK: "DECIMUS: main снова зелёный."

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Те же системные пакеты, что в Dockerfile: рендерер PDF и ffmpeg.
      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-dejavu-core ffmpeg

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        # Из lockfile с хэшами (`make lock`): pip отказывает на пакете без
        # совпавшего хэша, транзитивные версии не плавают (см. GHSA-7gm6-hc9m-w3vc).
        run: |
          pip install --require-hashes -r requirements-dev.txt -r requirements-build.txt
          pip install --no-deps --no-build-isolation -e .

      # Браузерные тесты (Playwright) без Chromium падают, а не пропускаются
      # (#1409): без этого шага они в CI не шли вовсе. Ключ кэша — lockfile,
      # версия Playwright в нём; системные пакеты браузера ставит `--with-deps`.
      - name: Chromium для браузерных тестов
        id: playwright-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Установить Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi

      - name: Формат
        run: ruff format --check .

      - name: Линт
        run: ruff check .

      - name: Типы
        run: mypy

      # Мёртвый код и границы модулей шли только в `make check`, и vulture
      # накопил 20 находок незамеченным (#862).
      - name: Мёртвый код
        run: |
          vulture
          deptry .

      - name: Границы модулей
        run: lint-imports

      - name: Тесты без базы
        run: |
          pytest -q -p no:cacheprovider -n auto 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "### Тесты без базы" >> "$GITHUB_STEP_SUMMARY"
          tail -n 2 pytest.log >> "$GITHUB_STEP_SUMMARY"
          echo "Тесты с базой здесь пропущены — они идут на MUSPELHEIM (make test)." >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Сверка lockfile с базами advisory и SBOM (см. GHSA-7gm6-hc9m-w3vc). Отдельное
  # задание: новое advisory на чужой пакет краснит его, не прячась за тестами.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install --require-hashes -r requirements-audit.txt

      - name: Сверка с базами advisory
        run: pip-audit -r requirements-dev.txt -r requirements-audit.txt -r requirements-build.txt --require-hashes --disable-pip --progress-spinner off

      - name: SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements.txt --of JSON -o sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  # Ворота: вердикт обоих заданий по прогону на main доставляется владельцу в Telegram.
  main-gate:
    if: always() && github.event_name == 'push'
    needs: [checks, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Задач не заводит: репозиторий публичный, наши задачи живут только в приватном
    # GarroV/backlog (решение владельца 15.11.2026). Сигнал уходит владельцу в Telegram,
    # и только при смене состояния — упало / восстановилось, без повтора каждый прогон.
    permissions:
      actions: read
    steps:
      - name: Сообщить владельцу, если состояние сменилось
        id: delivery
        env:
          ALERT_WORKFLOW: pr-checks.yml
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ needs.checks.result != 'success' || needs.audit.result != 'success' }}
          TG_TOKEN: ${{ secrets.ALERT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.ALERT_TG_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          now=ok; [ "$FAILED" = true ] && now=fail
          # Checkpoints carry only a delivered state (or the initial healthy baseline).
          # A failed send leaves no checkpoint; retry on the next scheduled/main run.
          was=unknown; source=unknown; looked=0
          runs=$(gh run list --workflow "$ALERT_WORKFLOW" --branch "$GITHUB_REF_NAME" --event "$GITHUB_EVENT_NAME" \
            --status completed -L 20 --json databaseId -q '.[].databaseId')
          if [ -z "$runs" ]; then was=ok; source=migration-baseline; fi
          # A rerun may already have a receipt in an earlier attempt of THIS run.
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then runs="$GITHUB_RUN_ID $runs"; fi
          for run_id in $runs; do
            [ "$looked" -lt 20 ] || break
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Некорректная история Actions."; exit 1; }
            looked=$((looked + 1))
            checkpoint=$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?filter=all" --paginate --slurp --jq '
              [.[].jobs[].steps[]? | select(.name |
                startswith("Telegram state ") or startswith("Telegram acknowledged "))] |
              if length == 0 then "legacy" else
                map(select(.conclusion == "success" and
                  (.name == "Telegram state fail" or .name == "Telegram state ok" or
                   .name == "Telegram acknowledged fail" or .name == "Telegram acknowledged ok"))) |
                sort_by(.completed_at) | last | .name // "pending" |
                sub("^Telegram acknowledged "; "Telegram state ")
              end')
            case "$checkpoint" in
              'Telegram state fail') was=fail; source=carried; break ;;
              'Telegram state ok') was=ok; source=carried; break ;;
              legacy) was=ok; source=migration-baseline; break ;;
              pending) ;;
              *) echo "::error::Не удалось прочитать подтверждённое состояние оповещений."; exit 1 ;;
            esac
          done
          if [ "$was" = unknown ] && [ "$now" = ok ]; then
            echo "::error::Нет подтверждения прежней тревоги за 20 прогонов — восстановление не отправлено."
            exit 1
          fi
          if [ "$now" = "$was" ]; then
            printf 'state=%s\nsource=%s\ndelivered=false\n' "$now" "$source" >> "$GITHUB_OUTPUT"
            echo "Подтверждённое состояние прежнее ($now) — молчу."
            exit 0
          fi
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::error::Нет секретов ALERT_TG_TOKEN / ALERT_TG_CHAT — оповещение не доставлено."; exit 1
          fi
          if [ "$now" = fail ]; then text="$ALERT_FAIL $RUN_URL"; else text="$ALERT_OK"; fi
          reply=$(mktemp "$RUNNER_TEMP/telegram-reply.XXXXXX")
          trap 'rm -f "$reply"' EXIT
          code=$(curl -sS -o "$reply" -w '%{http_code}' --max-time 20 \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${text}")
          [ "$code" = 200 ] || { echo "::error::Telegram ответил $code — оповещение не доставлено."; exit 1; }
          python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("ok") is True else 1)' "$reply" || {
            echo "::error::Telegram не подтвердил доставку — повторим в следующем прогоне."; exit 1;
          }
          printf 'state=%s\nsource=acknowledged\ndelivered=true\n' "$now" >> "$GITHUB_OUTPUT"

      # Separate the actual send receipt from the cheap carry-forward checkpoint.
      - name: Telegram acknowledged ${{ steps.delivery.outputs.state || 'unknown' }}
        if: steps.delivery.outputs.delivered == 'true'
        run: echo 'Telegram sendMessage acknowledged.'

      - name: Telegram state ${{ steps.delivery.outputs.state || 'unknown' }}
        if: success() && steps.delivery.outputs.state != ''
        run: echo 'State source = ${{ steps.delivery.outputs.source }}'

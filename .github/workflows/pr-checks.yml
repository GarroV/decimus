# Проверки каждого PR в main (решение владельца 12.10.2026: в репозиторий
# приходит второй разработчик, а `main` раскатывается на прод).
#
# Гоняет то, что не требует базы: формат, линт, типы и тесты без базы. Тесты,
# которым нужна база, здесь пропускаются — они идут на тестовой базе
# MUSPELHEIM (`make test`), и зелёный прогон здесь НЕ означает, что они
# прошли. Поэтому шаг тестов печатает число пропущенных в итог прогона.
#
# Решение владельца 12.10.2026: проверки больше не блокируют слияние (продукт ещё
# не в работе, «влить все и там уже тестировать»). PR-прогон справочный; ворота —
# прогон на `main` после слияния: если он красный, заводится задача «main красный»,
# а когда снова зелёный — закрывается. Красный main чинится раньше новых слияний.
#
# Расход: репозиторий публичный, минуты Actions бесплатны.
name: Проверки PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Заголовок — он же ключ поиска: задача одна, вторую не плодим.
  ISSUE_TITLE: "main красный"

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Те же системные пакеты, что в Dockerfile: рендерер PDF и ffmpeg.
      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-dejavu-core ffmpeg

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        # Из lockfile с хэшами (`make lock`): pip отказывает на пакете без
        # совпавшего хэша, транзитивные версии не плавают (см. GHSA-7gm6-hc9m-w3vc).
        run: |
          pip install --require-hashes -r requirements-dev.txt -r requirements-build.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Формат
        run: ruff format --check .

      - name: Линт
        run: ruff check .

      - name: Типы
        run: mypy

      # Мёртвый код и границы модулей шли только в `make check`, и vulture
      # накопил 20 находок незамеченным (#862).
      - name: Мёртвый код
        run: |
          vulture
          deptry .

      - name: Границы модулей
        run: lint-imports

      - name: Тесты без базы
        run: |
          pytest -q -p no:cacheprovider -n auto 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "### Тесты без базы" >> "$GITHUB_STEP_SUMMARY"
          tail -n 2 pytest.log >> "$GITHUB_STEP_SUMMARY"
          echo "Тесты с базой здесь пропущены — они идут на MUSPELHEIM (make test)." >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Сверка lockfile с базами advisory и SBOM (см. GHSA-7gm6-hc9m-w3vc). Отдельное
  # задание: новое advisory на чужой пакет краснит его, не прячась за тестами.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install --require-hashes -r requirements-audit.txt

      - name: Сверка с базами advisory
        run: pip-audit -r requirements-dev.txt -r requirements-audit.txt -r requirements-build.txt --require-hashes --disable-pip --progress-spinner off

      - name: SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements.txt --of JSON -o sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  # Ворота: вердикт обоих заданий по прогону на main доставляется задачей.
  main-gate:
    if: always() && github.event_name == 'push'
    needs: [checks, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Открыть задачу, если main красный
        if: needs.checks.result != 'success' || needs.audit.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue_no=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$issue_no" ]; then
            gh issue comment "$issue_no" --body "main всё ещё красный (${GITHUB_SHA::8}): $RUN_URL"
            exit 0
          fi
          printf 'Проверки на main упали на %s. Прогон: %s\n\nКрасный main чинится раньше новых слияний. Задача закроется сама, когда прогон на main станет зелёным.\n' "${GITHUB_SHA::8}" "$RUN_URL" > /tmp/body.md
          gh issue create --title "$ISSUE_TITLE" --body-file /tmp/body.md

      - name: Закрыть задачу, когда main снова зелёный
        if: needs.checks.result == 'success' && needs.audit.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          issue_no=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$issue_no" ]; then
            gh issue close "$issue_no" --comment "main снова зелёный (${GITHUB_SHA::8})."
          fi

# Сторож доступности MCP снаружи (#243).
#
# Живёт в Actions, а не на площадке, и это главное свойство: площадка — ноутбук,
# и проверка, запущенная на ней, молчит ровно тогда, когда она уснула или
# отвалилась от сети, то есть в единственном случае, ради которого сторож и
# нужен. 15.09.2026 продукт лежал, все контейнеры при этом были здоровы, а
# обнаружил это владелец собой.
#
# Красный прогон сам никого не будит — 17.09.2026 сторож краснел семь прогонов
# подряд, продукт пролежал сутки, и нашёл это снова владелец (#285, #287).
# Поэтому вердикт доставляется задачей: провал открывает её, возврат в зелёный
# закрывает. Задача уведомляет участников репозитория штатно, и для этого не
# нужен ни один секрет.
#
# Расход: репозиторий публичный, минуты Actions бесплатны. Прогон — секунды.
name: MCP снаружи

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      porcha:
        description: "Проверить самого сторожа: подменить адрес заведомо мёртвым и убедиться, что сигнал дошёл"
        type: boolean
        default: false

# Нужно, чтобы сторож мог открыть и закрыть свою задачу.
permissions:
  contents: read
  issues: write

env:
  # Заголовок — он же ключ поиска: задача у сторожа одна, вторую он не плодит.
  ISSUE_TITLE: "MCP снаружи недоступен"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Проверить дверь и установщик
        id: проба
        env:
          # Адрес — секрет репозитория: имя площадки в публичный код не пишется.
          # При проверке на порче он подменяется заведомо мёртвым: так видно,
          # что сторож умеет краснеть И что сигнал доходит, а не только что шаг
          # отработал.
          MCP_PUBLIC_URL: ${{ inputs.porcha && 'https://127.0.0.1:9' || secrets.MCP_PUBLIC_URL }}
        run: python3 tools/mcp_watch.py

      - name: Открыть задачу, если путь оборван
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          открытая=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$открытая" ]; then
            gh issue comment "$открытая" --body "Путь всё ещё оборван: $RUN_URL"
            exit 0
          fi
          cat > /tmp/тело.md <<ТЕКСТ
          Сторож не достучался до продукта снаружи. Прогон: $RUN_URL

          Дверь снаружи не отвечает ожидаемым отказом. Контейнеры на площадке при
          этом могут быть здоровы: сторож проверяет путь целиком, а не процесс.

          С чего начинать разбор — \`docs/08-deploy.md\`, раздел про звено: чаще
          всего это осиротевший \`link\` после одиночного рестарта \`mcp\`.

          Задача закроется сама, когда сторож снова станет зелёным.
          ТЕКСТ
          gh issue create --title "$ISSUE_TITLE" --body-file /tmp/тело.md

      - name: Закрыть задачу, когда путь вернулся
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          открытая=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$открытая" ]; then
            gh issue close "$открытая" --comment "Путь снаружи восстановлен, сторож зелёный."
          fi

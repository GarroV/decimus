# Сторож доступности продукта снаружи: MCP (#243) и вход в админку (F-111).
#
# Живёт в Actions, а не на площадке, и это главное свойство: площадка — ноутбук,
# и проверка, запущенная на ней, молчит ровно тогда, когда она уснула или
# отвалилась от сети, то есть в единственном случае, ради которого сторож и
# нужен. 15.09.2026 продукт лежал, все контейнеры при этом были здоровы, а
# обнаружил это владелец собой.
#
# Красный прогон сам никого не будит — 17.09.2026 сторож краснел семь прогонов
# подряд, продукт пролежал сутки, и нашёл это снова владелец (#285, #287).
# Поэтому вердикт доставляется владельцу в Telegram: провал и возврат в зелёный —
# по сообщению. Задач в публичном репозитории не заводит: наши задачи живут в
# приватном GarroV/backlog.
#
# Расход: репозиторий публичный, минуты Actions бесплатны. Прогон — секунды.
name: MCP снаружи

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      porcha:
        description: "Проверить самого сторожа: подменить адрес заведомо мёртвым и убедиться, что сигнал дошёл"
        type: boolean
        default: false

# Наименьшие права по умолчанию (F-102): прогон читает репозиторий и больше
# ничего. Секрет бота оповещений есть только у джобы `notify`, где нет ни
# checkout, ни секрета адреса.
permissions:
  contents: read

env:
  ALERT_FAIL: "DECIMUS: продукт снаружи недоступен (MCP или вход в админку)."
  ALERT_OK: "DECIMUS: продукт снаружи снова доступен."

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Проверить дверь MCP, установщик и страницу входа админки
        id: probe
        env:
          # Адрес — секрет репозитория: имя площадки в публичный код не пишется.
          # При проверке на порче он подменяется заведомо мёртвым: так видно,
          # что сторож умеет краснеть И что сигнал доходит, а не только что шаг
          # отработал.
          MCP_PUBLIC_URL: ${{ inputs.porcha && 'https://127.0.0.1:9' || secrets.MCP_PUBLIC_URL }}
          # Тот же приём для админки: у неё свой секрет, чтобы обрыв её пути
          # (Worker → VPC → Caddy) краснел отдельно от MCP.
          ADMIN_PUBLIC_URL: ${{ inputs.porcha && 'https://127.0.0.1:9' || secrets.ADMIN_PUBLIC_URL }}
        run: python3 tools/mcp_watch.py

  # Сообщает отдельная джоба: у `check` есть секрет адреса и чужой код из
  # checkout, но нет секрета бота; у этой есть секрет бота, но ни секрета адреса,
  # ни checkout. Результат пробы приходит через `needs`.
  notify:
    concurrency:
      group: mcp-alert-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: false
    needs: check
    if: always() && (needs.check.result == 'success' || needs.check.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Задач не заводит: репозиторий публичный, наши задачи живут только в приватном
    # GarroV/backlog (решение владельца 15.11.2026). Сигнал уходит владельцу в Telegram,
    # и только при смене состояния — упало / восстановилось, без повтора каждый прогон.
    permissions:
      actions: read
    steps:
      - name: Сообщить владельцу, если состояние сменилось
        id: delivery
        env:
          ALERT_WORKFLOW: mcp-outside.yml
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ needs.check.result == 'failure' }}
          TG_TOKEN: ${{ secrets.ALERT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.ALERT_TG_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          now=ok; [ "$FAILED" = true ] && now=fail
          # Checkpoints carry only a delivered state (or the initial healthy baseline).
          # A failed send leaves no checkpoint; retry on the next scheduled/main run.
          was=unknown; source=unknown; looked=0
          runs=$(gh run list --workflow "$ALERT_WORKFLOW" --branch "$GITHUB_REF_NAME" --event "$GITHUB_EVENT_NAME" \
            --status completed -L 20 --json databaseId -q 'sort_by(.databaseId) | reverse | .[].databaseId')
          # Pending jobs/reruns can start out of order despite serialization.
          # A completed newer run supersedes this result, including its checkpoint.
          [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ ]] || { echo "::error::Некорректный ID прогона."; exit 1; }
          for run_id in $runs; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Некорректная история Actions."; exit 1; }
            if [ "$run_id" -gt "$GITHUB_RUN_ID" ]; then
              echo "Более новый прогон уже завершён — устаревший результат пропущен."
              exit 0
            fi
          done
          if [ -z "$runs" ]; then was=ok; source=migration-baseline; fi
          # A rerun may already have a receipt in an earlier attempt of THIS run.
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then runs="$GITHUB_RUN_ID $runs"; fi
          for run_id in $runs; do
            [ "$looked" -lt 20 ] || break
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Некорректная история Actions."; exit 1; }
            looked=$((looked + 1))
            checkpoint=$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?filter=all" --paginate --slurp --jq '
              [.[].jobs[].steps[]? | select(.name |
                startswith("Telegram state ") or startswith("Telegram acknowledged "))] |
              if length == 0 then "legacy" else
                map(select(.conclusion == "success" and
                  (.name == "Telegram state fail" or .name == "Telegram state ok" or
                   .name == "Telegram acknowledged fail" or .name == "Telegram acknowledged ok"))) |
                sort_by(.completed_at) | last | .name // "pending" |
                sub("^Telegram acknowledged "; "Telegram state ")
              end')
            case "$checkpoint" in
              'Telegram state fail') was=fail; source=carried; break ;;
              'Telegram state ok') was=ok; source=carried; break ;;
              legacy) was=ok; source=migration-baseline; break ;;
              pending) ;;
              *) echo "::error::Не удалось прочитать подтверждённое состояние оповещений."; exit 1 ;;
            esac
          done
          if [ "$was" = unknown ] && [ "$now" = ok ]; then
            echo "::error::Нет подтверждения прежней тревоги за 20 прогонов — восстановление не отправлено."
            exit 1
          fi
          if [ "$now" = "$was" ]; then
            printf 'state=%s\nsource=%s\ndelivered=false\n' "$now" "$source" >> "$GITHUB_OUTPUT"
            echo "Подтверждённое состояние прежнее ($now) — молчу."
            exit 0
          fi
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::error::Нет секретов ALERT_TG_TOKEN / ALERT_TG_CHAT — оповещение не доставлено."; exit 1
          fi
          if [ "$now" = fail ]; then text="$ALERT_FAIL $RUN_URL"; else text="$ALERT_OK"; fi
          reply=$(mktemp "$RUNNER_TEMP/telegram-reply.XXXXXX")
          trap 'rm -f "$reply"' EXIT
          code=$(curl -sS -o "$reply" -w '%{http_code}' --max-time 20 \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${text}")
          [ "$code" = 200 ] || { echo "::error::Telegram ответил $code — оповещение не доставлено."; exit 1; }
          python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("ok") is True else 1)' "$reply" || {
            echo "::error::Telegram не подтвердил доставку — повторим в следующем прогоне."; exit 1;
          }
          printf 'state=%s\nsource=acknowledged\ndelivered=true\n' "$now" >> "$GITHUB_OUTPUT"

      # Separate the actual send receipt from the cheap carry-forward checkpoint.
      - name: Telegram acknowledged ${{ steps.delivery.outputs.state || 'unknown' }}
        if: steps.delivery.outputs.delivered == 'true'
        run: echo 'Telegram sendMessage acknowledged.'

      - name: Telegram state ${{ steps.delivery.outputs.state || 'unknown' }}
        if: success() && steps.delivery.outputs.state != ''
        run: echo 'State source = ${{ steps.delivery.outputs.source }}'

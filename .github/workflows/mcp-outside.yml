# Сторож доступности MCP снаружи (#243).
#
# Живёт в Actions, а не на площадке, и это главное свойство: площадка — ноутбук,
# и проверка, запущенная на ней, молчит ровно тогда, когда она уснула или
# отвалилась от сети, то есть в единственном случае, ради которого сторож и
# нужен. 15.09.2026 продукт лежал, все контейнеры при этом были здоровы, а
# обнаружил это владелец собой.
#
# Расход: репозиторий публичный, минуты Actions бесплатны. Прогон — секунды.
name: MCP снаружи

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Проверить дверь и установщик
        env:
          # Адрес — секрет репозитория: имя площадки в публичный код не пишется.
          MCP_PUBLIC_URL: ${{ secrets.MCP_PUBLIC_URL }}
        run: python3 tools/mcp_watch.py

# Прод на Linux (VPS) — надстройка над docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml <команда>
#
# Порядок подъёма, перенос данных и обновление — docs/08-deploy.md, §8.
#
# Чем прод отличается от стенда разработки и почему это надстройка, а не свой
# файл: сборка, окружение и тома сервисов остаются в docker-compose.yml, в одном
# месте, и прод не разъезжается со стендом на первой же правке. Здесь только
# то, что у прода иначе.
#
# 1. **Имя проекта постоянное — `decimus`.** От него зависят имена сети и томов
#    (`decimus_default`, `decimus_pgdata`, …). Раньше на MUSPELHEIM было два
#    проекта (`decimus-infra` и отдельный `decimus-web` со своей пустой базой,
#    #352), а веб цеплялся к сети и тому первого по жёстким именам из
#    незакоммиченной надстройки. Теперь это один проект: веб, MCP, бот и база
#    в одной сети по умолчанию, база одна.
#
# 2. **Наружу — через общий прокси, без звеньев.** Веб и MCP слушают сеть своего
#    контейнера (`*_LISTEN_NETWORK=1`, без ключа приложение откажется — оно по
#    умолчанию слушает только петлю). Порты на хост публикуются только на
#    127.0.0.1 — для смоука с самого сервера. К общему Caddy проект подключает
#    надстройка площадки (vps-infra: сеть `edge-decimus`). Цели для прокси:
#    `web:${WEB_PORT}` (8267) и `mcp:${MCP_PORT}` (8265). Звенья socat
#    (`web-link`, `link`) и туннель (`tunnel`) здесь выключены.
#
# 3. **Постоянные сервисы без профилей.** База, бот, MCP, веб, мини-апп обхода
#    (`walk`, D312) и хранилище кадров (`storage-live`, D635) поднимаются
#    всегда, а не по `COMPOSE_PROFILES`: забытый в окружении профиль тихо
#    оставлял бы прод без базы, админки или кадров. Демо (`demo`), мок
#    хранилища (`storage`), заведение корзины (`storage-init`, одноразовый
#    запуск из `prod-update.sh`) и бэкап состояния (`backup`, разовый запуск по
#    расписанию) остаются в своих профилях.

name: decimus

# Бюджет соединений к базе (`docs/08-deploy.md`, «Пул соединений»): `DB_POOL_MAX`
# задан на каждую службу явно, чтобы сумма не зависела от умолчания пула.
services:
  bot:
    environment:
      DB_POOL_MAX: "3"
    depends_on:
      db:
        condition: service_healthy

  mcp:
    environment:
      DB_POOL_MAX: "4"
      MCP_HOST: 0.0.0.0
      MCP_LISTEN_NETWORK: "1"
      # Адрес клиента в журнале действий (D462): перед MCP то же одно своё звено, что
      # перед админкой, — Caddy из сети `edge-decimus`. Без этого в журнал идёт адрес
      # Caddy. Подсеть берётся у админки, отдельной переменной по умолчанию не нужно.
      MCP_TRUSTED_PROXIES: ${MCP_TRUSTED_PROXIES:-1}
      MCP_TRUSTED_PROXY_ADDR: ${MCP_TRUSTED_PROXY_ADDR:-${WEB_TRUSTED_PROXY_ADDR:?задайте WEB_TRUSTED_PROXY_ADDR (подсеть сети edge-decimus), docs/08-deploy.md 8.1}}
      # Ключ фронта (F-107): по умолчанию тот же, что у админки. Задан — `X-Forwarded-For`
      # верим только звену с верным `X-Decimus-Front-Key`. Пусто — как раньше.
      MCP_FRONT_KEY: ${MCP_FRONT_KEY:-${WEB_FRONT_KEY:-}}
    ports: !override
      - "127.0.0.1:${MCP_HOST_PORT:-8266}:${MCP_PORT:-8265}"
    depends_on: !override
      db:
        condition: service_healthy

  web:
    profiles: !reset []
    environment:
      DB_POOL_MAX: "4"
      WEB_HOST: 0.0.0.0
      WEB_LISTEN_NETWORK: "1"
      # Перед админкой одно своё звено — Caddy (F-007 аудита 12.10): без этого
      # счётчик перебора один на всех.
      WEB_TRUSTED_PROXIES: ${WEB_TRUSTED_PROXIES:-1}
      # Кому из соседей верить `X-Forwarded-*` (F-038): подсеть сети
      # `edge-decimus`, откуда приходит Caddy, — в окружении площадки
      # (docs/08-deploy.md, §8.1). Допускающего умолчания нет: «любой сосед»
      # (`*`) отдавал выбор адреса и схемы каждому, кто дотянулся до порта, а
      # пустое значение — 403 на каждую форму за HTTPS. Не задана — прод не
      # собирается.
      WEB_TRUSTED_PROXY_ADDR: ${WEB_TRUSTED_PROXY_ADDR:?задайте WEB_TRUSTED_PROXY_ADDR (подсеть сети edge-decimus), docs/08-deploy.md 8.1}
      # Ключ фронта Cloudflare (F-107): задан — `X-Forwarded-*` верим только запросу с
      # верным `X-Decimus-Front-Key`, а не любому соседу по подсети. Пусто — как раньше
      # (docs/08-deploy.md, §8.9).
      WEB_FRONT_KEY: ${WEB_FRONT_KEY:-}
    ports: !override
      - "127.0.0.1:${WEB_HOST_PORT:-8268}:${WEB_PORT:-8267}"
    depends_on: !override
      db:
        condition: service_healthy

  # Мини-апп обхода — постоянный, как админка: она передаёт ему `/tg/walk*`.
  # Слушает сеть контейнера уже в общей сборке, порт на хост не публикуется.
  walk:
    profiles: !reset []
    environment:
      DB_POOL_MAX: "2"
    depends_on: !override
      db:
        condition: service_healthy

  # Звенья и туннель прода не нужны: наружу выводит общий прокси. Профиль,
  # который никто не включает, — способ выключить сервис надстройкой.
  web-link:
    profiles: !override ["legacy-link"]
  link:
    profiles: !override ["legacy-link"]
  tunnel:
    profiles: !override ["legacy-link"]

  db:
    profiles: !reset []

  # Том состояния бота (`decimus_state`) бэкапит площадка: он перечислен в
  # `/etc/vps-backup/targets.conf` на VPS (канон — GarroV/vps-infra), ночной
  # `vps-backup` кладёт его через restic на MUSPELHEIM. Меток на томах нет —
  # список целей живёт там, а не здесь (#456).
  #
  # Кадры проверок (D635, с 23.10.2026): своё хранилище на VPS, MinIO в службе
  # `storage-live` с томом `storage-data` (`decimus_storage-data`). Том в ночном
  # бэкапе VPS (`vps-infra`, `targets.conf`) — резерв на MUSPELHEIM. Порт наружу
  # не публикуется: приложение ходит по сети проекта, `S3_ENDPOINT_URL=http://storage-live:9000`.
  # Образ MinIO реестр не отдаёт (#396) — он перенесён `docker save | docker load`
  # (docs/08-deploy.md, §8.2). Профиля у службы нет: `up` поднимает её всегда.
  storage-live:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    # Без учётки MinIO встаёт со своей общеизвестной `minioadmin` (F-014 аудита
    # 12.10), поэтому пустая учётка — отказ подняться. Проверка в команде, а не
    # `${VAR:?}`: Compose проверял бы её и у тех, кто хранилище не поднимает.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ "$${#MINIO_ROOT_USER}" -lt 3 ] || [ "$${#MINIO_ROOT_PASSWORD}" -lt 16 ]; then
        echo "storage-live: задайте FRAMES_ROOT_USER (от 3 знаков) и FRAMES_ROOT_PASSWORD (от 16)" >&2;
        exit 1; fi;
        exec minio server /data --console-address ":9001"
    environment:
      # Root-ключи хранилища: только в `/srv/decimus/.env`. Приложение под ними
      # не ходит — у него свой пользователь `decimus-app` (его заводит `storage-init`).
      MINIO_ROOT_USER: ${FRAMES_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${FRAMES_ROOT_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Заведение корзины и пользователя приложения (D635). Одноразовая служба в
  # профиле `storage-init`, как `migrate`: её запускает `prod-update.sh`
  # (`run --rm`), повторный запуск ничего не ломает. Пользователь `decimus-app`
  # получает ключи приложения из `S3_ACCESS_KEY_ID` / `S3_SECRET_ACCESS_KEY` и
  # политику `decimus-frames-rw` — только корзина `${S3_BUCKET}`.
  storage-init:
    profiles: ["storage-init"]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      storage-live:
        condition: service_healthy
    environment:
      # Готовый адрес с учёткой: `mc` берёт доступ из окружения, ключи не
      # попадают в аргументы команды.
      MC_HOST_own: http://${FRAMES_ROOT_USER:-}:${FRAMES_ROOT_PASSWORD:-}@storage-live:9000
      BUCKET: ${S3_BUCKET:-inspection-frames}
      APP_USER: ${S3_ACCESS_KEY_ID:-}
      APP_SECRET: ${S3_SECRET_ACCESS_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e;
        if [ -z "$$APP_USER" ] || [ "$${#APP_SECRET}" -lt 8 ]; then
        echo "storage-init: задайте S3_ACCESS_KEY_ID и S3_SECRET_ACCESS_KEY (от 8 знаков)" >&2; exit 1; fi;
        mc mb --ignore-existing "own/$$BUCKET";
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::%s"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$$BUCKET" "$$BUCKET" > /tmp/policy.json;
        mc admin policy create own decimus-frames-rw /tmp/policy.json;
        mc admin user add own "$$APP_USER" "$$APP_SECRET";
        mc admin policy attach own decimus-frames-rw --user "$$APP_USER";
        mc ls own

volumes:
  storage-data:

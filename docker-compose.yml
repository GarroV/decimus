# Стенды бота выездных проверок: боевой и демонстрационный (T071, T102).
#
# Имя проекта зашито здесь же (`name:`), а не оставлено флагу `-p`: имя внутри
# файла общее для каждой копии репозитория, и без своего префикса `up` на
# чужой площадке подхватил бы контейнеры соседа, а `down -v` унёс бы его том.
# `-p decimus-infra` / `COMPOSE_PROJECT_NAME` всё ещё работают и
# перебивают это значение — но полагаться приходится не на память оператора.
name: decimus-infra

# Демо и боевой стенд — один файл, один образ, один способ настройки. Это и
# есть механизм решения D059: демо отставало от `main`, потому что жило
# отдельной ручной процедурой. Отдельного `docker-compose.demo.yml` здесь
# намеренно нет — второй файл расходится с первым, и заметно это будет на
# показе. Различаются ровно три вещи: данные (синтетические, английские),
# состояние (свой том) и доступы (свой токен бота — Telegram отдаёт
# обновления только одному получателю, поделить один токен нельзя).
#
#   docker compose up -d                   # боевой стенд
#   docker compose --profile demo up -d    # он же плюс демо
#   tools/demo_refresh.sh                  # подтянуть main и пересобрать демо
#   make demo-down                         # снести ТОЛЬКО демо
#
# ЗАПРЕЩЁННАЯ КОМАНДА: `docker compose --profile demo down -v`.
# Она выглядит симметричной к `--profile demo up -d`, но сносит боевой стенд
# вместе с демо и удаляет том `state` — состояние всех идущих проверок
# партнёров. Причина в семантике Compose: сервис без `profiles:` считается
# активным при ЛЮБОМ значении `--profile`, а `-v` удаляет все именованные тома
# проекта, а не только тома сервисов профиля. Проверено запуском на такой же
# топологии: боевой том исчез, хотя демо даже не поднималось.
# Сносить демо только поимённо — этим занимается `make demo-down`.
#
# Портов наружу не публикует ни один сервис стенда. У бота HTTP-поверхности нет
# вовсе — long polling (решение D004), Telegram сам держит соединение наружу. У
# MCP-сервера она есть, и он всё равно не публикуется: он отдаёт проверки
# партнёров по токену, а площадка общая. Наружу его выводит туннель (сервис
# `tunnel` ниже, решение D100). Диапазон 8220-8229, выделенный этой рабочей
# копии, поэтому не занят ни одним портом.

# Общая часть обоих стендов. Якорь, а не копия: скопированный блок разъезжается
# молча, и демо снова начнёт отставать от продукта.
x-stand: &stand
  build:
    context: .
    dockerfile: Dockerfile
    args:
      # Подставляет scripts/deploy.sh. Руками собранный образ честно ответит
      # «неизвестна» — это лучше правдоподобной подделки (T246).
      BUILD_SHA: ${BUILD_SHA:-}
  restart: unless-stopped
  # Секреты и параметры продукта — из .env целиком, имена и назначение — в
  # .env.example. Демо берёт их из ТОГО ЖЕ файла тем же механизмом (D059):
  # то, что обязано отличаться, лежит в нём рядом под префиксом DEMO_ и
  # перекрывается ниже через `environment`, а не заводится вторым набором
  # где-то ещё.
  env_file:
    - .env

# Окружение демо целиком: один якорь на оба демо-сервиса (сид и бот), чтобы
# они не могли разъехаться между собой.
x-demo-env: &demo-env
  # Демо считается по своему чек-листу и никогда по боевому.
  AUDIT_DATA_DIR: /app/demo/data
  # Демо говорит по-английски целиком (задача T131). Сама демо-проверка
  # заводится английской сидом, но до её начала язык брать неоткуда — его
  # задаёт эта переменная, иначе первое, что видит человек, открывший демо,
  # приветствие и мастер, остаётся русским. Значение стоит здесь, а не в .env
  # под префиксом DEMO_: это свойство демо, а не настройка запускающего.
  BOT_UI_LANG: en
  # Обе переменные указывают в один том. Сид читает DEMO_STATE_DIR (на
  # STATE_DIR он не смотрит намеренно — иначе `make demo` на сервере писал бы
  # в боевые проверки), бот читает STATE_DIR. Здесь это один путь, и это
  # видно в файле, а не подразумевается.
  DEMO_STATE_DIR: /app/state
  STATE_DIR: /app/state
  TZ: ${TZ:-UTC}
  # Свой токен: один токен на два бота Telegram не делится — второй получатель
  # молча выбивает первого. Пусто — бот откажется стартовать с внятным
  # сообщением (`src/bot/config.py`), и это лучше, чем демо, случайно поднятое
  # на боевом токене: подстановка `:-` даёт пустое значение вместо того, чтобы
  # унаследовать боевое из `env_file`.
  TELEGRAM_BOT_TOKEN: ${DEMO_TELEGRAM_BOT_TOKEN:-}
  ALLOWED_TELEGRAM_IDS: ${DEMO_ALLOWED_TELEGRAM_IDS:-}
  # База демо — отдельная и по умолчанию никакая. Боевую демо не трогает ни
  # при каких обстоятельствах (D059).
  DATABASE_URL: ${DEMO_DATABASE_URL:-}

x-demo-volumes: &demo-volumes
  # Чек-лист демо приезжает из рабочей копии, а не из образа: правка данных в
  # `main` доезжает до демо без пересборки образа (задача T102).
  - ./demo/data:/app/demo/data:ro
  - demo-state:/app/state

services:
  bot:
    <<: *stand

    # AUDIT_DATA_DIR и STATE_DIR приходят из .env для хоста (см. volumes
    # ниже), но внутри контейнера намеренно переопределены на точки
    # монтирования: .env хранит host-путь для разработки без Docker, а не
    # путь внутри образа.
    environment:
      AUDIT_DATA_DIR: /app/data
      STATE_DIR: /app/state
      TZ: ${TZ:-UTC}

    volumes:
      # Методика — данные управляющей компании (docs/furca/plan.md, «Данные
      # предметной области лежат вне репозитория»): каталог снаружи, в образ
      # не запекается (см. Dockerfile). `:ro` — бот методику не правит,
      # `manage.py` не отсюда запускается.
      - ${AUDIT_DATA_DIR:-./data}:/app/data:ro
      # Состояние идущих проверок (`inspection.json` на чат, решение D007) —
      # именованный том, переживает пересоздание и переезд контейнера
      # (решение D004) без правки пути на диске конкретного хоста.
      - state:/app/state

  # --- MCP-сервер: сервис стенда, а не команда оператора (T255, #210) --------
  #
  # До этой задачи сервер поднимали руками (`make mcp`), и жил он ровно до
  # конца сессии запустившего. Проверено на площадке: бот выдавал человеку
  # правильный доступ, а порт не слушал никто — и снаружи это выглядело
  # поломкой Claude, потому что все контейнеры были зелёными.
  #
  # ПОРТ НАРУЖУ НЕ ПУБЛИКУЕТСЯ, и `ports:` здесь не забыт. Сервер отдаёт
  # проверки партнёров по токену, а площадка общая — рядом живут чужие
  # проекты. Он и сам откажется стартовать на внешнем адресе
  # (`src/mcp/config.py`, `_parse_host`), и снимать эту проверку нельзя.
  # Наружу ведёт туннель — сервис `tunnel` ниже.
  mcp:
    <<: *stand
    # Тот же образ, что у бота, другая точка входа. Второй Dockerfile
    # разошёлся бы с первым ровно так же, как разъезжалось демо (D059).
    command: ["python", "-m", "src.mcp"]

    depends_on:
      # База — источник всего, что сервер читает: без неё его инструменты
      # отдают пустоту, а личные токены (T253) проверить нечем. `required:
      # false` не мягкость, а факт топологии: база живёт в профиле `db`
      # (D061 — она бывает и снаружи compose), и жёсткая зависимость сделала
      # бы `docker compose up -d` невозможным на стенде без этого профиля.
      db:
        condition: service_healthy
        required: false

    environment:
      # Точки монтирования внутри контейнера, как у бота: в .env лежат
      # host-пути для работы без Docker.
      AUDIT_DATA_DIR: /app/data
      # Полка снимков изданий методики (`STATE_DIR/methodology/`, T169) —
      # её пишет бот, сервер только читает (`src/mcp/letters.py`).
      STATE_DIR: /app/state
      TZ: ${TZ:-UTC}
      # Адрес прослушивания назван ЗДЕСЬ и назван петлёй — хотя сервер и сам
      # ничего другого не примет. Петля внутри контейнера это петля
      # КОНТЕЙНЕРА: до неё не дотягивается ни соседний проект на машине, ни
      # другой контейнер этого же стенда. Единственный, кто её видит, —
      # процесс в том же сетевом пространстве, то есть туннель ниже.
      MCP_HOST: 127.0.0.1
      # MCP_PORT намеренно не перекрывается: он приходит из .env, а не задан —
      # сервер берёт своё умолчание (8265). Меняя его, поменяйте и адрес, на
      # который смотрит туннель, — он настраивается на стороне Cloudflare.
      #
      # Список профилей передаётся В КОНТЕЙНЕР ради пробы здоровья (T279).
      # Ровно эта строка решает, поднимается ли звено `link` ниже, — значит ею
      # же проба узнаёт, обязано ли звено отвечать. Отдельный признак «звено
      # ожидается» разошёлся бы с профилем молча: 17.09.2026 контейнер стоял
      # `healthy`, а снаружи отдавал 502 именно потому, что проба мерила не тот
      # отрезок пути.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}

    volumes:
      # Методика — снаружи и только на чтение, как у бота.
      - ${AUDIT_DATA_DIR:-./data}:/app/data:ro
      # Тот же том состояния, что у бота, и намеренно :ro. Полка изданий
      # принадлежит идущим проверкам; сервер её читает и не имеет права
      # писать в неё ничем — монтирование это и подтверждает, а не обещает.
      - state:/app/state:ro

    # Публикация на ПЕТЛЮ ХОСТА — только для случая, когда наружу ведёт не свой
    # туннель, а общий вход площадки (T260). Пусто по умолчанию: без значения
    # переменной строки нет вовсе, и всё остаётся как было — сервер виден
    # только из своего сетевого пространства.
    #
    # Адрес прибит к `127.0.0.1` намеренно и вынести его в переменную нельзя:
    # площадка общая, и `0.0.0.0` здесь отдал бы проверки партнёров всей сети.
    # Настраивается ПОРТ, а не адрес.
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8266}:8266"

    healthcheck:
      # Своя проверка обязательна: в образ запечена проверка БОТА (`pgrep -f
      # "python -m src.bot"`, см. Dockerfile), и для сервера она была бы
      # красной всегда. Проба стучится на петлю и требует отказа 401 от
      # нашего сервера — почему именно так, разобрано в самом файле.
      test: ["CMD", "python", "tools/mcp_healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- веб-админка управляющей компании (T318, T319, решение D148) ----------
  #
  # Тот же образ, что у бота и MCP, другая точка входа: серверный рендеринг на
  # Flask + waitress, без Node и сборщика.
  #
  # ПОРТ НАРУЖУ НЕ ПУБЛИКУЕТСЯ, и `ports:` здесь не забыт. Вход у админки
  # появился (T323): логин, пароль, сессия, закрытые маршруты, — но выход
  # наружу от этого не становится публикацией порта. Наружу мы выходим
  # ТУННЕЛЕМ (D100), тем же приёмом, что у MCP (сервис `link` ниже):
  # площадка общая, и опубликованный порт отдал бы соседям по машине форму
  # входа для перебора вместе с историей проверок всей сети за ней. Сам выход
  # наружу — отдельная задача и отдельное движение (T324).
  #
  # Чтобы посмотреть админку глазами сегодня, её поднимают на хосте: `make web`.
  # Здесь сервис нужен затем, чтобы поверхность собиралась и поднималась в том
  # же образе, что продукт, — и чтобы это проверялось пробой здоровья, а не
  # предполагалось.
  web:
    <<: *stand
    command: ["python", "-m", "src.web"]

    # Профиль, а не сервис по умолчанию: входа у админки нет (см. README и
    # `docs/12-web-admin.md`), и боевой стенд не должен поднимать её просто
    # потому, что поднимают бота. Проверка `test_db_stand` держит ровно это:
    # обычный `up -d` даёт bot и mcp, всё остальное включается своим профилем.
    profiles: ["web"]

    depends_on:
      # База — источник всего, что админка показывает. `required: false` по той
      # же причине, что у MCP: база живёт в профиле `db` (D061) и бывает
      # снаружи compose, а жёсткая зависимость сделала бы `up -d` невозможным
      # на стенде без этого профиля.
      db:
        condition: service_healthy
        required: false

    environment:
      TZ: ${TZ:-UTC}
      # Точки монтирования внутри контейнера, как у бота и MCP: снаружи лежат
      # host-пути для работы без Docker.
      #
      # Методика нужна админке не для показа — показывает она записанное в
      # базе, — а для ПИСЬМА партнёру (T321). Письмо нигде не хранится и
      # собирается заново движком по методике той версии, которой помечена
      # проверка; без этих двух путей экран письма честно скажет, что собрать
      # его не из чего, и будет говорить это всегда.
      AUDIT_DATA_DIR: /app/data
      # Полка снимков изданий методики (`STATE_DIR/methodology/`, T169): её
      # пишет бот, админка только читает — как и MCP.
      STATE_DIR: /app/state
      # Адрес назван здесь и назван петлёй, хотя админка и сама ничего другого
      # не примет (`src/web/config.py`, `_parse_host`). Петля внутри контейнера
      # — петля КОНТЕЙНЕРА: до неё не дотягивается ни соседний проект, ни
      # другой контейнер этого стенда.
      WEB_HOST: 127.0.0.1

    volumes:
      # Методика — снаружи и только на чтение, как у бота и MCP.
      - ${AUDIT_DATA_DIR:-./data}:/app/data:ro
      # Тот же том состояния, и намеренно :ro. Полка изданий принадлежит идущим
      # проверкам; админка её читает и не имеет права писать в неё ничем —
      # монтирование это подтверждает, а не обещает.
      - state:/app/state:ro
      # WEB_PORT, WEB_TENANT и WEB_UI_LANG приходят из файла окружения и здесь
      # намеренно не перекрываются: чей это стенд и на каком он языке —
      # свойство развёртывания, а не файла в репозитории.

    ports:
      # Только петля хоста, и порт здесь ЗВЕНА, а не сервера: сам сервер сидит
      # на петле контейнера и опубликованным портом недостижим (та же механика,
      # что у MCP, — см. `link` ниже). Публикация нужна тому, кто выводит стенд
      # наружу с хоста: туннелю, общему входу площадки или человеку с браузером
      # на самой машине. На 0.0.0.0 не публикуется никогда: площадка общая, и
      # это отдало бы соседям форму входа вместе с историей проверок за ней.
      - "127.0.0.1:${WEB_HOST_PORT:-8268}:8268"

    healthcheck:
      # Своя проверка обязательна: в образ запечена проверка БОТА (`pgrep -f
      # "python -m src.bot"`, см. Dockerfile), и для админки она была бы
      # красной всегда. Проба стучится на ту же петлю, что слушает сервер, и
      # требует ответа от реестра — то есть меряет весь путь до базы, а не
      # факт живого процесса. База выключена — контейнер честно нездоров.
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,os,sys;p=os.environ.get('WEB_PORT') or '8267';sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{p}/inspections',timeout=4).status==200 else 1)\""
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s

  # --- звено до админки (профиль `web`, задача T324) -------------------------
  #
  # Тот же приём и та же причина, что у звена до MCP (`link` ниже): сервер
  # слушает петлю ВНУТРИ контейнера и сам внешний адрес не примет
  # (`src/web/config.py`, `_parse_host`), а до петли контейнера не дотягивается
  # ни проброшенный порт, ни соседний контейнер. Звено сидит в сетевом
  # пространстве админки, принимает на 8268 — том, что сервис `web` публикует
  # на петлю хоста, — и шлёт на порт сервера рядом.
  #
  # Профиль тот же, что у админки, а не отдельный: без звена стенд бесполезен —
  # к админке нельзя подключиться даже с самой машины, и «поднял, но не
  # работает» стоило бы ровно того же вечера, что у MCP (#285, #286).
  #
  # ПЕРЕСОЗДАЛИ `web` — ПЕРЕСОЗДАЙТЕ ЗВЕНО. Оно останется в сетевом
  # пространстве, которого больше нет, будет числиться `Up` и молча ничего не
  # отдавать: снаружи это выглядит как 502 при здоровом сервере.
  web-link:
    profiles: ["web"]
    # Версия прибита, как у звена до MCP: обновление — отдельное осознанное
    # изменение, а не то, что подтянулось между двумя `up`.
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: "service:web"
    command:
      - "TCP-LISTEN:8268,fork,reuseaddr"
      - "TCP:127.0.0.1:${WEB_PORT:-8267}"
    depends_on:
      web:
        condition: service_healthy

  # --- звено до сервера (профиль `funnel`, задача #216, решение D102) --------
  #
  # Нужно там, где наружу ведёт ОБЩИЙ вход площадки (Tailscale Funnel), а не
  # свой туннель. Сервер слушает петлю ВНУТРИ контейнера (`MCP_HOST:
  # 127.0.0.1`), и проброшенный порт до неё не доходит: соединение приходит на
  # внешний интерфейс, которого сервер не слушает. Звено — единственное место,
  # где это переключается; слушать внешний адрес самому серверу по-прежнему
  # незачем, и он этого не станет (`src/mcp/config.py`, `_parse_host`).
  #
  # Порты: слушает 8266 — тот, что сервис `mcp` публикует на петлю хоста, — и
  # шлёт на 127.0.0.1 с портом сервера (умолчание 8265). Занять 8266 может
  # только звено: сервер сидит на другом порту, конфликта нет.
  #
  # `network_mode: "service:mcp"` — та же главная строка, что и у туннеля: без
  # неё `127.0.0.1` звена был бы его собственным, а не сервера. Отсюда то же
  # следствие: пересоздали `mcp` — пересоздайте звено, иначе оно останется в
  # сетевом пространстве, которого больше нет, будет выглядеть рабочим и
  # ничего не отдавать. До #216 звено поднимали руками, и осиротевшие копии
  # накапливались молча; теперь оно поднимается вместе со стендом.
  #
  # Профиль отдельный от `tunnel`: на площадке со своим доменом наружу ведёт
  # туннель, и звено там не нужно. Включается строкой `COMPOSE_PROFILES=funnel`
  # в `.env`; забытая строка ловится смоуком раскатки, а не тишиной.
  link:
    profiles: ["funnel"]
    # Версия прибита, как у туннеля и базы: обновление звена — отдельное
    # осознанное изменение, а не то, что подтянулось между двумя `up`.
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: "service:mcp"
    # Звено сидит в сетевом пространстве сервера не от красоты: сервер слушает
    # петлю (D100), и из отдельной сети compose до него не достучаться. Цена
    # этого — пересоздание `mcp` оставляет звено висеть на исчезнувшем
    # пространстве: socat принимает соединение, апстрим отвечает отказом, а
    # контейнер числится `Up`. Снаружи это сутки выглядело как 502 при здоровом
    # сервере (#285, #286).
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      # Проверяется АПСТРИМ, а не собственный процесс: живой socat при мёртвом
      # апстриме — ровно тот сбой, который надо ловить. `nc -z` из busybox
      # alpine/socat: соединение установилось — значит сервер на той стороне
      # есть.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${MCP_PORT:-8265}"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 10s
    command:
      - "TCP-LISTEN:8266,fork,reuseaddr"
      - "TCP:127.0.0.1:${MCP_PORT:-8265}"

  # --- туннель наружу (профиль `tunnel`, задача T256, #211, решение D100) ----
  #
  # Наружу выходим туннелем, а не открытым портом: сервер остаётся на петле,
  # снаружи виден только туннель с TLS, соседи по общей машине доступа не
  # получают.
  #
  # ГЛАВНАЯ СТРОКА СЕРВИСА — `network_mode: "service:mcp"`. Она означает, что
  # туннель живёт в СЕТЕВОМ ПРОСТРАНСТВЕ контейнера mcp: его `127.0.0.1` и
  # петля сервера — одно и то же. Поэтому туннель ходит к петле, как и
  # требовалось, и никакого другого пути к серверу не появляется: чтобы
  # достучаться до него по сети compose, серверу пришлось бы слушать внешний
  # адрес, а он этого не делает и не станет.
  #
  # Следствие, которое стоит помнить руками: пересоздали контейнер `mcp` —
  # пересоздайте и туннель (`docker compose up -d --force-recreate tunnel`),
  # иначе он останется в сетевом пространстве, которого больше нет.
  #
  # Профиль, а не сервис по умолчанию: туннелю нужен свой секрет, и на
  # ноутбуке разработчика он не нужен вовсе. На площадке профиль включается
  # не памятью оператора, а строкой `COMPOSE_PROFILES=tunnel` в `.env` — тогда
  # обычный `docker compose up -d` поднимает и его. Забытая строка ловится
  # смоуком раскатки (`scripts/smoke.sh`), а не тишиной.
  tunnel:
    profiles: ["tunnel"]
    # Версия прибита, как и у Postgres: обновление туннеля — отдельное
    # осознанное изменение, а не то, что подтянулось между двумя `up`.
    image: cloudflare/cloudflared:2026.8.3
    restart: unless-stopped
    network_mode: "service:mcp"
    # `--no-autoupdate` уже стоит в entrypoint образа: обновляться сам он не
    # должен — версия прибита выше, и подменившийся под нами бинарник это
    # ровно то, чего прибитая версия не допускает.
    command: ["tunnel", "run"]

    environment:
      # Секрет туннеля приходит переменной, а не аргументом команды:
      # аргументы процесса видны на машине всем через `ps`, а площадка общая.
      # Тем же приёмом и по той же причине прячет токен мост
      # (`tools/mcp_bridge.sh`). Пусто — cloudflared скажет «Provided Tunnel
      # token is not valid» и не поднимется; это лучше туннеля, поднятого
      # неизвестно куда.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TZ: ${TZ:-UTC}

  # --- демо-стенд (профиль `demo`, задача T102) ------------------------------
  #
  # Поднимается только с `--profile demo`, поэтому обычный `docker compose
  # up -d` боевого стенда его не трогает и не требует демо-переменных.

  # Наполнение демо. Отдельный одноразовый контейнер, а не шаг в entrypoint
  # бота: сид обязан отработать ДО старта бота и обязан быть перезапускаемым
  # сам по себе — обновление демо это пересев, а не перезапуск продукта.
  demo-seed:
    <<: *stand
    profiles: ["demo"]
    restart: "no"
    command: ["python", "tools/seed_demo.py"]
    # Окружение и тома — общие с демо-ботом, якорями выше. Ссылка, а не копия,
    # намеренно: сид и бот обязаны видеть один и тот же чек-лист и один и тот
    # же том, иначе бот покажет не то, что насеяли.
    environment: *demo-env
    volumes: *demo-volumes

  demo:
    <<: *stand
    profiles: ["demo"]
    depends_on:
      demo-seed:
        condition: service_completed_successfully
    environment: *demo-env
    volumes: *demo-volumes

  # --- Postgres под завершённые проверки (профиль `db`, задача T090) ---------
  #
  # Профиль, а не сервис по умолчанию: сегодня база живёт на хосте (решение
  # D061 — локальный Postgres, переезд в Supabase позже и сменой DATABASE_URL),
  # и обычный `docker compose up -d` не обязан поднимать вторую рядом.
  # `docker compose --profile db up -d` поднимает базу ВМЕСТЕ с ботом:
  # сервис без `profiles:` активен при любом значении `--profile`, поэтому
  # связывать их через depends_on не нужно — и нельзя, иначе боевой стенд начал
  # бы тянуть за собой базу, которой у него может не быть.
  #
  # ЗАПРЕЩЁННАЯ КОМАНДА: `docker compose --profile db down -v`. Ровно та же
  # ловушка, что у демо-профиля выше: `-v` удаляет ВСЕ именованные тома
  # проекта, а не только тома профиля, и вместе с базой уносит `state` —
  # состояние всех идущих проверок. Сносить поимённо: `make db-down`.
  #
  #   make db-up      # поднять базу, дождаться готовности и накатить схему
  #   make db-down    # снести ТОЛЬКО базу, том с данными оставить
  db:
    profiles: ["db"]
    # Версия прибита точно, как и версии пакетов: обновление базы — отдельное
    # осознанное изменение, а не то, что подтянулось само между двумя `up`.
    # 16.x — та же ветка, на которой блок разрабатывался и проверялся.
    image: postgres:16.14-alpine
    restart: unless-stopped

    environment:
      # Имя базы и роль. DATABASE_URL в .env обязан совпадать с ними — иначе
      # бот придёт в базу, которой нет, и узнает об этом на первом же сливе.
      POSTGRES_DB: ${POSTGRES_DB:-dodo_audit_service}
      POSTGRES_USER: ${POSTGRES_USER:-dodo_audit}
      # Пусто — контейнер откажется стартовать с внятным сообщением. Это лучше,
      # чем база проверок партнёров без пароля.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      TZ: ${TZ:-UTC}

    ports:
      # Только петля, и это не перестраховка: площадка общая (рядом на сервере
      # живут чужие проекты), а публикация на 0.0.0.0 отдала бы базу проверок
      # всей сети. Боту публикация не нужна вовсе — он ходит по внутренней сети
      # compose на `db:5432`; наружу порт торчит только для хоста: накатить
      # схему `make migrate` и заглянуть глазами.
      # Порт настраиваемый: на машине разработчика 5432 обычно уже занят своим
      # Postgres, и параллельные рабочие копии обязаны расходиться по портам.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    healthcheck:
      # Готовность именно базы, а не контейнера: `up -d` отдаёт управление
      # раньше, чем Postgres начинает принимать соединения, и накат схемы
      # следующей же командой упирался бы в отказ связи. `$$` — экранирование
      # для compose: переменные подставляет оболочка внутри контейнера.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dodo_audit} -d $${POSTGRES_DB:-dodo_audit_service}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

    # Метка, по которой ночная задача площадки находит контейнеры для дампа
    # (`C:\backups\pg_backup.ps1`, 03:30, хранение 14 дней). Сверено фактом
    # 17.09.2026: дамп базы проверок снимается и сегодня — но по ЗАПАСНОМУ
    # правилу той же задачи, «в имени образа есть postgres», а не по метке.
    # Запасное правило держится на имени чужого образа: перейдём на pgvector,
    # на сборку своим именем или на образ с другим тегом — база тихо выпадет из
    # бэкапа, и узнают об этом в день, когда дамп понадобится. Метка — явный
    # признак, который переживает смену образа.
    labels:
      backup.pgdump: "true"

    volumes:
      # Данные — в именованном томе, отдельном от состояния идущих проверок:
      # пересоздание контейнера базы не имеет права задеть ни то, ни другое.
      - pgdata:/var/lib/postgresql/data


  # --- хранилище кадров для локального смоука (профиль `storage`, задача T094)
  #
  # Кадр в базе — это `telegram_file_id`, который снаружи не открывается и живёт
  # ровно столько, сколько живёт бот с этим токеном. При завершении проверки
  # кадры уезжают в S3-совместимое хранилище (D054), и вот на чём это можно
  # прогнать локально, не заводя ничего в облаке и не платя ни за что.
  #
  # Почему именно s3mock, а не MinIO: репозиторий MinIO архивирован в апреле
  # 2026 (проверено через GitHub API), новых патчей community-издание не
  # получит, а корзину там всё равно пришлось бы заводить отдельным
  # контейнером. Здесь корзина создаётся переменной, лицензия Apache-2.0,
  # проект живой, образ есть под arm64.
  #
  # ЭТО СТЕНД ДЛЯ СМОУКА, А НЕ ХРАНИЛИЩЕ. Тома у него нет намеренно: данные не
  # переживают пересоздание контейнера, и лучше, чтобы это было очевидно, чем
  # чтобы кто-то принял его за место, где можно держать кадры проверок.
  # Боевое хранилище задаётся переменными S3_* и находится снаружи.
  #
  #   make storage-up     # поднять и дождаться готовности
  #   make storage-down   # снести ТОЛЬКО хранилище
  storage:
    profiles: ["storage"]
    image: adobe/s3mock:4.9.0
    restart: unless-stopped

    environment:
      # Корзина заводится стендом заранее. Код продукта корзин не создаёт
      # намеренно: в настоящем хранилище таких прав у него нет и не должно быть.
      initialBuckets: ${S3_BUCKET:-inspection-frames}
      TZ: ${TZ:-UTC}

    ports:
      # Только петля, по той же причине, что у базы: площадка общая.
      - "127.0.0.1:${S3_STAND_PORT:-9090}:9090"

    healthcheck:
      # Готовность именно S3 API: корневой запрос обязан вернуть список корзин.
      # Проверять открытый порт мало — JVM поднимается несколько секунд, и порт
      # успевает ответить раньше, чем начинает работать API.
      test:
        ["CMD-SHELL", "wget -q -O - http://localhost:9090/ | grep -q ListAllMyBucketsResult"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s


  # --- боевое хранилище файлов (профиль `storage-live`, D166, #318) ---------
  #
  # Сосед выше (`storage`) — МОК: он держит объекты в памяти и умирает вместе с
  # контейнером. Для прогонов это ровно то, что нужно, а для доказательств
  # проверки — нет, поэтому боевое хранилище отдельной службой и с томом.
  #
  # Оно временное по решению, а не по устройству (D166): переезд на внешнее
  # хранилище стоит правки `S3_*` в окружении, потому что продукт говорит с
  # ним S3-совместимым языком через `src/db/storage.py` (D054, D061).
  storage-live:
    profiles: ["storage-live"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped

    environment:
      # Учётка администратора хранилища. Задаётся окружением площадки и в
      # репозиторий не уезжает — как и все остальные секреты продукта.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
      TZ: ${TZ:-UTC}

    volumes:
      # Том, а не папка на хосте: переезд контейнера не требует правки пути на
      # конкретной машине (та же причина, что у базы, D004).
      - storage-data:/data

    ports:
      # Только петля, по той же причине, что у базы и у мока: площадка общая, и
      # доказательства проверок на общем адресе делать нечего. Наружу файлы
      # выдаёт админка, а не хранилище.
      - "127.0.0.1:${S3_LIVE_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"

    healthcheck:
      # Готовность именно хранилища, а не открытого порта: MinIO отвечает на
      # порту раньше, чем начинает принимать объекты.
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  # --- выгрузка состояния в бэкап (профиль `backup`, задача #233) ------------
  #
  # Бэкап площадки умеет только дампы Postgres: задача по расписанию обходит
  # контейнеры с меткой `backup.pgdump=true`. Том `state` не выгружался никуда,
  # а в нём лежат папки идущих проверок и связки доступа
  # (`access/roster.json`). Цена потери связок разобрана в `docs/08-deploy.md`,
  # §4.2: отметки «приглашение использовано» вычисляются из самого файла, так
  # что его потеря не закрывает доступ, а расширяет.
  #
  # Одноразовый сервис, а не постоянный: он делает архив и выходит. Расписание
  # у площадки своё (`docs/08-deploy.md`, §4.7), и держать ради него живой
  # контейнер незачем — `restart: "no"` тут поэтому не украшение: с
  # `unless-stopped` он крутился бы в петле, делая архив каждые несколько
  # секунд, пока не кончится место.
  #
  #   docker compose run --rm state-backup     # или make state-backup
  #
  # Профиль `backup` — чтобы обычный `up -d` его не трогал вовсе.
  state-backup:
    <<: *stand
    profiles: ["backup"]
    restart: "no"
    command: ["python", "tools/state_backup.py"]

    environment:
      # Точки монтирования ВНУТРИ контейнера, как у бота: в .env лежат
      # host-пути. `BACKUP_DIR` в .env — это каталог бэкапа на площадке
      # (`C:\backups`), а процессу внутри нужен путь контейнера, и он всегда
      # один и тот же.
      STATE_DIR: /app/state
      BACKUP_DIR: /backup
      # Сколько суток хранить СВОИ архивы. 14 — как у бэкапа Postgres на
      # площадке, чтобы два разных срока не пришлось держать в голове.
      # `0` означает «не удалять ничего».
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-UTC}

    volumes:
      # Состояние — ТОЛЬКО на чтение: задача бэкапа снять копию, а не менять
      # то, что копирует. Смонтированное на запись однажды окажется тем, чем
      # состояние идущих проверок испортят.
      - state:/app/state:ro
      # Каталог бэкапа на площадке. Умолчание — папка рядом с копией
      # репозитория, чтобы на ноутбуке это работало без настройки.
      #
      # Каталог ОБЩИЙ: рядом в нём лежат дампы чужих проектов этой машины.
      # Поэтому инструмент удаляет по ретеншну только файлы своего имени
      # (`decimus-state-*.tar.gz`) и ничьи больше.
      - ${BACKUP_DIR:-./backups}:/backup


volumes:
  # Файлы проверок: кадры и отчёты (D166). В дамп базы НЕ входит —
  # бэкап площадки умеет только Postgres, и это записано в решении.
  storage-data:
  state:
  # Отдельный том демо: пересев демо не может задеть идущие боевые проверки.
  demo-state:
  # Данные Postgres (профиль `db`). Отдельный том, а не папка на хосте:
  # переезд контейнера не требует правки пути на конкретной машине (D004).
  pgdata:
